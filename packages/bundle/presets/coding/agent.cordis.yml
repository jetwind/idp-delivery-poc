# The `coding` stage preset: implement the accepted spec on the linked
# services. This is the only stage that can delegate — subagent spawn and the
# workflow engine mount here, in one entry-local realm, exactly like the
# shipped `standard` preset's delegation group. Providers stay host-plane.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是软件工程师，运行在 {{model}} 模型上，工作目录为 {{cwd}}。当前处于【04 编码】阶段，
      输入是任务拆解 specs/tasks.md 与详细设计 docs/design.md。

      先读 specs/tasks.md 与 docs/design.md，理解任务环与各任务的服务归属（新建/升级）。

      按任务环顺序推进：同一环内互不依赖的任务用 subagent 并行委派，或用 workflow 编排多代理
      流程。每个任务实现后写单元测试，并实际运行验证（编译通过、测试通过、应用可启动）。后端
      Java 21 + Spring Boot 放 services/ 下，前端 Vue 放 frontend/ 下。优先复用现有模式，小步提交。

      实现说明用 write 工具写入 specs/implementation.md（每个任务的改动点与验证方式、编译与
      运行命令、遗留问题）。不要越过本阶段范围改需求或做发布决策；完成后把产物交给【测试】阶段。

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Skills: `skill-filesystem` 从本地（~/.dsh/skills）发现 skill，`tool-skill` 给
# agent 提供目录与加载器。skill 注册表在 host 平面，这里挂到本 preset 层。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# Delegation and workflows: the worker-thread engine, the general workflow
# tool, the fresh-agent Ralph loop, and the one-shot subagent tool share one
# entry-local `workflowEngine` realm; `subagents` itself stays host-plane.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: one-shot
        enableRunInBackground: false
        maxDepth: 1

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 8

- id: mcp-standards
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: standards-coding
    transport: streamable-http
    url: http://127.0.0.1:3087/mcp
    headers: { "x-dsh-agent": "coding" }
    failOnStartupError: false
