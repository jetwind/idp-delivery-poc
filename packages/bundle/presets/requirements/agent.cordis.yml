    allowParallelInProgress: true

- id: mcp-standards
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: standards-requirements
    transport: stdio
    command: python
    args:
      - '-u'
      - !!js process.env.DSH_STANDARDS_SERVER || 'D:/ccn-work/src/github/deepseek-harness-delivery/mcp/standards_server.py'
    env: {}
    cwd: ''
    failOnStartupError: false
