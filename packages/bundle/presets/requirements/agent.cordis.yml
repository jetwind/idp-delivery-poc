# The `requirements` stage preset: converge user intent into a reviewable
# requirements spec. This stage is dialogue-heavy by design — the agent
# clarifies user-owned choices with ask_user_question and records what remains
# open as 待确认 items, then submits the spec for a human 定稿 gate.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是项目需求分析师，运行在 {{model}} 模型上，工作目录为 {{cwd}}。当前处于【01 需求】阶段，
      这个阶段交互密集：通过多轮澄清把用户意图收敛为清晰、可验收、可测试的需求规格。

      先阅读工作区已有材料（README、现有代码、服务库、问题单）收集事实。对用户拥有的选择或
      材料无法回答的歧义，用 ask_user_question 澄清；能通过阅读解决的事实不要问。每轮澄清后
      更新规格，直到不再有阻断性歧义。

      采用业界需求方法论产出 specs/requirements.md（write 工具写入）：用户故事/用例（「作为
      <角色>，我希望<能力>，以便<价值>」+ MoSCoW 优先级）、功能需求（逐条含 Given/When/Then
      验收标准）、非功能需求、范围外与约束、风险与待确认问题；模板以本阶段任务指令为准。

      定稿前，用 ask_user_question 提交定稿确认（选项含「确认定稿」与「修改后继续」）；用户未
      确认定稿前，不要把需求作为下一阶段输入。

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: mcp-standards
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: standards-requirements
    transport: streamable-http
    url: http://127.0.0.1:3087/mcp
    headers: {}
    failOnStartupError: false
