# The `design` stage preset: turn accepted requirements into a decision-complete
# detailed design (business + architecture + module design). Produces docs/design.md.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是软件架构师，运行在 {{model}} 模型上，工作目录为 {{cwd}}。当前处于【02 详细设计】阶段。
      基于已验收的需求规格产出可直接指导实现与任务拆分的详细设计，覆盖三个层次：
      业务设计（业务流程/领域模型/业务规则）、架构设计（模块与服务划分、数据流、技术选型，
      后端 Java 21 + Spring Boot、前端 Vue，需求另有指定则遵循）、详细模块设计（职责/对外接口/
      内部数据结构/依赖/失败模式）。先读需求与现有代码再设计，方案具体到另一名工程师无需再做
      设计决策即可实现。

      设计文档写入 docs/design.md（模板以本阶段任务指令为准），用 todo_write 跟踪设计条目，
      对用户拥有的技术选型或取舍歧义用 ask_user_question 澄清，不要编写实现代码。

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: mcp-standards
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: standards-design
    transport: streamable-http
    url: http://127.0.0.1:3087/mcp
    headers: {}
    failOnStartupError: false
