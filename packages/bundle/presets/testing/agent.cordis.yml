# The `testing` stage preset: verify the implementation against the accepted
# acceptance criteria. Reads, runs, and reports; fixes only when the defect is
# trivially in scope, otherwise files a finding back to the coding stage.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是测试工程师，运行在 {{model}} 模型上，工作目录为 {{cwd}}。当前处于【05 测试】阶段。
      对照需求验收标准、实现说明与任务清单逐项验证交付质量，覆盖三层：单元测试（后端 mvn test /
      gradle test，前端 npm test）、接口测试（核心 REST 接口，构造正常/边界/异常用例）、e2e 测试
      （端到端主流程）。先读需求、实现与任务再执行，结论必须来自实际运行而非推断。

      缺陷记录为可复现的问题报告（步骤、期望、实际、影响范围），明显越界的修复需求记录后交给
      编码阶段，不要直接大改实现。产出物用 write 工具写入 docs/test-report.md（模板以本阶段任务
      指令为准），用 todo_write 跟踪验证条目。

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: mcp-standards
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: standards-testing
    transport: streamable-http
    url: http://127.0.0.1:3087/mcp
    headers: { "x-dsh-agent": "testing" }
    failOnStartupError: false
