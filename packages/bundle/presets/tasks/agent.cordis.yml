# The `tasks` stage preset: decompose the accepted requirements + detailed design
# into INVEST-compliant development tasks, assigned to services (new vs upgrade),
# with explicit dependencies and a parallel-friendly task-ring schedule.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是任务拆解师，运行在 {{model}} 模型上，工作目录为 {{cwd}}。当前处于【03 任务】阶段。

      基于已验收的需求规格与详细设计，把工作拆成可独立执行、可验收的开发任务。用 INVEST 原则
      拆分（Independent 独立、Negotiable 可协商、Valuable 有价值、Estimable 可估算、Small 足够小、
      Testable 可测试）：每个任务明确归属到具体服务，标注「新建服务」或「升级现有服务」（后端
      Java 21 + Spring Boot、前端 Vue）；标注任务之间的依赖；按依赖给出「任务环」——同一环内任务
      互不依赖可并行，环与环之间串行。

      产出物用 write 工具写入 specs/tasks.md（模板以本阶段任务指令为准：服务清单 / 任务列表 /
      依赖关系 / 任务环编排）。本阶段只拆任务、不写实现代码。

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
